security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_SUPER_ADMIN:  [ROLE_ADMIN]
        ROLE_ADMIN:        [ROLE_TENANT_ADMIN]
        ROLE_TENANT_ADMIN: [ROLE_TENANT]

    providers:
        app_user_provider:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/shopify/install,    roles: ROLE_TENANT_ADMIN }
        - { path: ^/shopify/callback,   roles: ROLE_TENANT_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
